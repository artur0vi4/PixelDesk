name: Build exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build PixelDesk.exe
        run: |
          $pyi = @('--noconfirm','--clean','--windowed','--onefile','--name','PixelDesk','main.py')
          if (Test-Path 'app/resources/app.ico') { $pyi = @('--icon','app/resources/app.ico') + $pyi }
          pyinstaller @pyi

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: PixelDesk-windows
          path: dist/PixelDesk.exe

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PixelDesk.exe
